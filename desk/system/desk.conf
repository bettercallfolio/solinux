# Where the Solinux desktop listens.
#
# 127.0.0.1 means this computer only: right for a machine started with "chainboot run",
# which shares the network of the computer it runs on.
# 0.0.0.0 lets other computers on the network open the desktop (a booted Solinux that you
# use from your own computer). Anyone who has the token in ~/.config/solinux/desk-token can
# then do everything you can do here; the connection is not encrypted.
HOST=127.0.0.1
PORT=7654
